[project]
name = "termo-pirolisis"
version = "0.1.0"
description = "Peng-Robinson con pseudocomponentes para el tren de separación de la pirólisis"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
